project:
  id: simple
  title: "Simple example"
  fps: 25
  width: 160
  height: 90

bin:
  - id: photo
    path: assets/photo.png
  - id: clip
    path: assets/clip.mp4
  - id: tone
    path: assets/tone.mp3
  - id: caption
    type: title
    text: "kdenlive-as-code"

timeline:
  tracks:
    - type: audio
      clips:
        - {clip: tone, start: 0, out: 3, fade_out: 0.5}
    - type: video
      clips:
        - {clip: photo, start: 0, duration: 1.5, fade_in: 0.5}
        # speed: plays clip.mp4 at 1.5x - `duration:` below is on the
        # already-warped (sped-up) timeline (2s / 1.5 = 1.33s), not the
        # source file's.
        - {clip: clip, start: 1.5, duration: 1.3, speed: 1.5, mute: true}
        - {clip: caption, start: 2.85, duration: 1.5, fade_in: 0.3}
