[project]
name = "kdenlive-generator"
version = "0.4.0"
description = "Programmatic kdenlive project generator from a declarative YAML description, meant for versioning videos with a VCS (like Git)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
reconstruct = [
    "numpy>=1.21",
    "Pillow>=9.0",
]

[project.scripts]
kdgen = "kdenlive_generator.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kdenlive_generator = ["lumas_data/*.pgm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
