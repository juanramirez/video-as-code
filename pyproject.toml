[project]
name = "video-as-code"
version = "0.10.0"
description = "Programmatic kdenlive project generator from a declarative YAML description, meant for versioning videos with a VCS (like Git)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
reconstruct = [
    "numpy>=1.21",
    "Pillow>=9.0",
]
upscale = [
    "Pillow>=9.0",
]
docs = [
    "markdown>=3.0",
]

[project.scripts]
video-as-code = "video_as_code.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_as_code = [
    "lumas_data/*.pgm",
    "gltransitions_data/*.c",
    "gltransitions_data/*.json",
    "gltransitions_data/LICENSE",
    "gltransitions_data/glsl3/*.glsl",
    "gltransitions_data/glsl_filters/*.glsl",
    "gltransitions_data/glsl_filters/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
